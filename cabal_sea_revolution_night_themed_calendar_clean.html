const contentType=document.getElementById('contentType'),viewMode=document.getElementById('viewMode'),streamerWrap=document.getElementById('streamerWrap');
const streamer=document.getElementById('streamer'),phase=document.getElementById('phase'),calendar=document.getElementById('calendar'),monthTitle=document.getElementById('monthTitle'),modal=document.getElementById('detail');
DATA.forEach((s,i)=>streamer.add(new Option(s.name,String(i))));
const allDates=DATA.flatMap(s=>s.tasks.map(t=>t.date)).sort();
let month=(allDates.find(d=>d>='2026-10-22')||allDates[0]||'2026-10-01').slice(0,7);
function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function category(t){let p=(t.phase||'').toUpperCase();return p.includes('REVO NIGHT')?'REVO':p==='OBT'?'OBT':p==='CBT'?'CBT':'OTHER'}
function typeOf(t){if(t.sharedCampaign)return 'Unspecified';
 const c=String(t.content||'').trim().replace(/^[▶️🔁📌💜🟣\s]+/u,'').trim();
 if(/^(?:\d+\s*)?(?:video\s*share|share\s*post|repost|share\s+(?:the\s+)?official)/i.test(c))return 'Share Post';
 if(/^(?:\d+\s*)?(?:video\s*reels?|reels?\b)/i.test(c))return 'Reels';
 if(/^(?:\d+\s*)?(?:image\s*\/\s*static\s*post|static\s*post|image\s*post)/i.test(c))return 'Static Post';
 if(/^(?:\d+\s*)?(?:video\s*(?:content|post|clip|production)?\s*[:–-]|livestream|live\s*stream|video\b)/i.test(c))return 'Video';
 return 'Unspecified';
}
function short(s){return String(s).split('\n')[0].replace(/^(?:1 )?(?:Video Reel|Image\/Static Post|Livestream|Video Content)\s*[–:-]\s*/i,'').slice(0,65)}
function render(){
 const [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),offset=(first.getDay()+6)%7,days=new Date(y,m,0).getDate();
 monthTitle.textContent=first.toLocaleString('en-US',{month:'long',year:'numeric'});
 const overall=viewMode.value==='overall',s=DATA[Number(streamer.value)||0];
 const tasks=(overall?DATA.flatMap(s=>s.tasks.map(t=>({...t,streamerName:s.name}))):s.tasks.map(t=>({...t,streamerName:s.name}))).filter(t=>(phase.value==='ALL'||category(t)===phase.value)&&(contentType.value==='ALL'||(t.sharedCampaign?({'Reels':true,'Video':true,'Static Post':true,'Share Post':true}[contentType.value]===true):typeOf(t)===contentType.value)));
 document.getElementById('status').textContent=overall?`All ${DATA.length} streamers · ${tasks.length} assignments · Click a content item to see instructions and assigned streamers`:`${s.name} · ${tasks.length} matching tasks · Click any content item for instructions`;
 streamerWrap.style.display=overall?'none':'';
 calendar.innerHTML=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="weekday">${d}</div>`).join('');
 const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Manila'});
 for(let i=0;i<Math.ceil((offset+days)/7)*7;i++){
 const d=i-offset+1,valid=d>0&&d<=days,key=`${month}-${String(d).padStart(2,'0')}`,items=valid?tasks.filter(t=>t.date===key):[];
 const cell=document.createElement('div');cell.className='cell'+(!valid?' other':'')+(key===today?' today':'');
 if(valid){
 const num=document.createElement('div');num.className='num';num.textContent=d;cell.append(num);
 const events=SPECIAL_EVENTS[key]||[];
 events.forEach(event=>{const b=document.createElement('button');b.className='special-event'+(event.type==='Offline Event'?'':' milestone-event');b.textContent=(event.type==='Offline Event'?'📍 OFFLINE EVENT · ':'⭐ IMPORTANT DATE · ')+event.title;b.onclick=()=>showEvent(key,event);cell.append(b)});
 const unique=new Set(items.map(t=>t.sharedCampaign?'REVO_WINDOW':t.streamerName+'|'+t.content)).size;
 const countLabel=document.createElement('div');countLabel.className='day-total';countLabel.textContent=`${unique} streamer content${unique===1?'':'s'}`;cell.append(countLabel);
 const official=PURPLE_TEAM[key]||[];
 if(official.length){
 const team=document.createElement('button');team.className='purple-team';team.textContent=`💜 PURPLE TEAM CONTENT · ${official.length} official post${official.length===1?'':'s'}`;
 team.onclick=()=>showPurple(key,official);cell.append(team);
 }
 if(overall && items.length){
 const groups=new Map();
 items.forEach(t=>{const k=t.sharedCampaign?'REVO_ALL_STREAMERS':category(t)+'|'+typeOf(t)+'|'+String(t.content||'').trim();if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t)});
 [...groups.values()].sort((a,b)=>new Set(b.map(t=>t.streamerName)).size-new Set(a.map(t=>t.streamerName)).size).forEach(group=>{
 const btn=document.createElement('button');btn.className='entry';btn.dataset.phase=category(group[0]);if(group[0].sharedCampaign)btn.classList.add('shared');
 const count=new Set(group.map(t=>t.streamerName)).size;
 btn.textContent=group[0].sharedCampaign?`★ REVO NIGHT · All ${count} streamers · Post anytime Oct 24–28 (deadline Oct 28)`:`[${typeOf(group[0])}] ${short(group[0].content)||'Content task'} · ${count} streamer${count===1?'':'s'}`;
 btn.title=group[0].content;
 btn.addEventListener('click',()=>showGroup(key,group));
 cell.append(btn);
 });
 }else if(!overall){items.forEach(t=>{const btn=document.createElement('button');btn.className='entry';btn.dataset.phase=category(t);if(t.sharedCampaign)btn.classList.add('shared');btn.textContent=t.sharedCampaign?'★ REVO NIGHT · Posting window Oct 24–28 (due Oct 28)':`[${typeOf(t)}] ${short(t.content)||'Content task'}`;btn.title=t.content;btn.addEventListener('click',()=>show(t,s.name));cell.append(btn)})}
 }calendar.append(cell);
 }
}
function showEvent(key,event){
 document.getElementById('detailDate').textContent=new Date(key+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 document.getElementById('detailTitle').textContent=(event.type==='Offline Event'?'📍 ':'⭐ ')+event.type+' — '+event.title;
 document.getElementById('detailContent').textContent=event.description||event.title;
 document.getElementById('detailRef').style.display='none';modal.showModal();
}
function showPurple(key,titles){
 document.getElementById('detailDate').textContent=new Date(key+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 document.getElementById('detailTitle').textContent='💜 PURPLE TEAM CONTENT — Official Page';
 document.getElementById('detailContent').textContent=titles.map((v,i)=>`${i+1}. ${v}`).join('\n\n');
 document.getElementById('detailRef').style.display='none';modal.showModal();
}
function showGroup(key,items){
 const t=items[0],names=[...new Set(items.map(x=>x.streamerName))].sort();
 document.getElementById('detailDate').textContent=new Date(key+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' · '+category(t)+' · '+typeOf(t);
 document.getElementById('detailTitle').textContent=`${names.length} streamer${names.length===1?'':'s'} assigned`;
 const content=document.getElementById('detailContent');content.textContent='';
 const instructions=document.createElement('div');instructions.textContent=t.content||'No instructions provided';content.append(instructions);
 const heading=document.createElement('h4');heading.textContent='Assigned streamers';content.append(heading);
 const roster=document.createElement('div');roster.textContent=names.join(' · ');content.append(roster);
 const ref=document.getElementById('detailRef');ref.textContent='';ref.style.display='none';
 modal.showModal();
}
function showDay(key,items){
 document.getElementById('detailDate').textContent=new Date(key+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 document.getElementById('detailTitle').textContent=`Overall schedule · ${items.length} assignments`;
 const content=document.getElementById('detailContent');content.textContent='';
 items.sort((a,b)=>a.streamerName.localeCompare(b.streamerName)).forEach(t=>{const b=document.createElement('button');b.className='entry';b.dataset.phase=category(t);b.textContent=`${t.streamerName} · ${category(t)} · ${short(t.content)}`;b.onclick=()=>show(t,t.streamerName);content.append(b)});
 document.getElementById('detailRef').style.display='none';modal.showModal();
}
function show(t,name){
 document.getElementById('detailDate').textContent=new Date(t.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' · '+category(t)+' · '+typeOf(t);
 document.getElementById('detailTitle').textContent=name+' — Content instructions';
 document.getElementById('detailContent').textContent=t.content||'No description provided';
 const ref=document.getElementById('detailRef');ref.textContent='';ref.style.display='none';
 modal.showModal();
}
function shift(n){let [y,m]=month.split('-').map(Number);let d=new Date(y,m-1+n,1);month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()}
document.getElementById('prev').onclick=()=>shift(-1);document.getElementById('next').onclick=()=>shift(1);
document.getElementById('current').onclick=()=>{month=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Manila'}).slice(0,7);render()};
viewMode.onchange=render;streamer.onchange=render;phase.onchange=render;contentType.onchange=render;document.getElementById('close').onclick=()=>modal.close();
modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});
render();
